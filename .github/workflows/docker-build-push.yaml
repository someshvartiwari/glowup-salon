name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:

    runs-on: self-hosted

    steps:

      # Step 1: Checkout source code  
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:latest .


      # Step 4: Push Docker image to Docker Hub to work with the self-hosted runner
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:latest