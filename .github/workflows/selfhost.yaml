
name: CI Pipeline Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================
  # BUILD JOB
  # =========================
  build-job:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  # =========================
  # TEST JOB
  # =========================
  test-job:
    runs-on: self-hosted
    needs: build-job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: ignore

  # =========================
  # LINT JOB
  # =========================
  lint:
    runs-on: self-hosted
    needs: build-job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint:report

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: eslint-report.json
          if-no-files-found: ignore

  # =========================
  # DOCKER BUILD & PUSH
  # =========================
  docker:
    runs-on: self-hosted
    needs:
      - build-job
      - test-job
      - lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Dockerfile
        shell: powershell
        run: |
          if (!(Test-Path "Dockerfile")) {
            throw "Dockerfile not found in repository root"
          }

          docker --version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker build `
            -t "$env:DOCKERHUB_USERNAME/glowup-salon:latest" `
            -t "$env:DOCKERHUB_USERNAME/glowup-salon:$env:IMAGE_TAG" `
            -t "$env:DOCKERHUB_USERNAME/glowup-salon:$env:IMAGE_SHA" `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed"
          }

      - name: Push Docker images
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker push "$env:DOCKERHUB_USERNAME/glowup-salon:latest"
          if ($LASTEXITCODE -ne 0) { throw "Push latest failed" }

          docker push "$env:DOCKERHUB_USERNAME/glowup-salon:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Push branch tag failed" }

          docker push "$env:DOCKERHUB_USERNAME/glowup-salon:$env:IMAGE_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Push SHA failed" }

  # =========================
  # DEPLOY JOB
  # =========================
  deploy:
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Deploy application locally
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker pull "$env:DOCKERHUB_USERNAME/glowup-salon:latest"

          if ($LASTEXITCODE -ne 0) {
            throw "Docker pull failed"
          }

          $existing = docker ps -aq --filter "name=glowup-salon"

          if ($existing) {
            docker rm -f glowup-salon
          }

          docker run -d `
            --name glowup-salon `
            --restart unless-stopped `
            -p 5173:5173 `
            "$env:DOCKERHUB_USERNAME/glowup-salon:latest"

          if ($LASTEXITCODE -ne 0) {
            throw "Container deployment failed"
          }

          docker ps --filter "name=glowup-salon"
          Write-Host "Application deployment command completed."
