name: CI Pipeline Demo

on:
  push:
    branches:
      - main

  #workflow_dispatch:


jobs:

  # =========================
  # BUILD JOB
  # =========================

  build-job:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: dist


  # =========================
  # TEST JOB
  # =========================

  test-job:
    runs-on: ubuntu-latest

    needs: build-job

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage


  # =========================
  # LINT JOB
  # =========================

  lint:
    runs-on: ubuntu-latest

    needs: build-job

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci  # this will install the dependencies defined in package.json

      - name: Run linting
        run: npm run lint:report

      - name: Upload linting report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: eslint-report.json


  # =========================
  # DOCKER BUILD & PUSH JOB hgh
  # =========================

  docker:
    runs-on: ubuntu-latest

    needs:
      - build-job
      - test-job
      - lint

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:${{ github.ref_name }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:${{ github.sha }} .

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:${{ github.ref_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:${{ github.sha }}


  # =========================
  # DEPLOY JOB 
  # =========================

  deploy:
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        run: echo "Deploying application... Best of luck bhai!"