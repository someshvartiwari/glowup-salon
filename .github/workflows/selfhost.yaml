name: CI Pipeline Demo

on:
  push:
    branches:
      - main

  #workflow_dispatch:


jobs:

  # =========================
  # BUILD JOB for the project and this mins 
  # =========================

  build-job:
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4 #Because this step is essential to get the code from the repository to the runner, so that subsequent steps can work with the codebase.

      - name: Setup Node.js
        uses: actions/setup-node@v4 #Why? This step is necessary to set up the Node.js environment on the runner, allowing us to run Node.js commands and scripts.
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies  #this step will install the dependencies defined in package.json
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: dist


  # =========================
  # TEST JOB
  # =========================

  test-job:
    runs-on: self-hosted

    needs: build-job

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage  #Why? This step is necessary to upload the test coverage reports generated by the tests, allowing for later analysis and reporting.


  # =========================
  # LINT JOB
  # =========================

  lint:
    runs-on: self-hosted

    needs: build-job

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci  # this will install the dependencies defined in package.json

      - name: Run linting
        run: npm run lint:report

      - name: Upload linting report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: eslint-report.json  #because this step is necessary to upload the linting report generated by the linting process, allowing for later analysis and reporting.


  # =========================
  # DOCKER BUILD & PUSH JOB hgh
  # =========================

  docker:
    runs-on: self-hosted

    needs:
      - build-job
      - test-job
      - lint

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} #this step is necessary to authenticate with Docker Hub using the provided username and token, allowing us to push Docker images to the repository.
          password: ${{ secrets.DOCKERHUB_TOKEN }}  #this step is necessary to authenticate with Docker Hub using the provided username and token, allowing us to push Docker images to the repository.

      - name: Build Docker image #because this step is necessary to build the Docker image for the application, tagging it with the appropriate version and SHA for later use.
        run: |
          docker build \
            -t username/glowup-salon:latest \
            -t username/glowup-salon:main .

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:${{ github.ref_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:${{ github.sha }}


  # =========================
  # DEPLOY JOB 
  # =========================

  deploy:
    runs-on: self-hosted

    needs:
      - docker

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        run: echo "Deploying application... Best of luck bhai    !"