
name: CI Pipeline Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================
  # BUILD JOB
  # =========================
  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  # =========================
  # TEST JOB
  # =========================
  test-job:
    runs-on: ubuntu-latest
    needs: build-job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: ignore

  # =========================
  # LINT JOB
  # =========================
  lint:
    runs-on: ubuntu-latest
    needs: build-job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run linting
        run: npm run lint:report

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: eslint-report.json
          if-no-files-found: ignore

  # =========================
  # DOCKER BUILD & PUSH
  # =========================
  docker:
    runs-on: ubuntu-latest
    needs:
      - build-job
      - test-job
      - lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:main
            ${{ secrets.DOCKERHUB_USERNAME }}/glowup-salon:${{ github.sha }}

  # =========================
  # DEPLOY JOB
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deployment status
        run: echo "Docker image successfully pushed to Docker Hub. for deployment or cloud platform."
